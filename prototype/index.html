function setPage(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){$('#nav').innerHTML=NAV.map(([id,ico,name])=>`<button class="nav ${page===id?'active':''}" data-nav="${id}" title="${name}"><span>${ico}</span>${name}</button>`).join('')}
function scopeItems(){return [['company:all','Toàn công ty'],...DEPTS.map(x=>['department:'+x.id,'Phòng · '+x.name]),...TEAMS.map(x=>['team:'+x.id,'Team · '+x.name]),...PROJECTS.map(x=>['project:'+x.id,'Dự án · '+x.code]),...STAFF.map(x=>['employee:'+x.id,'Nhân viên · '+x.name]),...STAFF.filter(x=>x.kind==='AI'&&STAFF.some(e=>e.manager===x.id)).map(x=>['manager:'+x.id,'Quản lý · '+x.name]),...Array.from(new Set(STAFF.map(x=>x.role))).map(r=>['role:'+r,'Role · '+r])];}
function reportingSubtree(root){const found=new Set([root]);let changed=true;while(changed){changed=false;for(const e of STAFF)if(e.manager&&found.has(e.manager)&&!found.has(e.id)){found.add(e.id);changed=true}}return found}
function inScope(t){const [type,id]=scope.split(':');const owner=staff(t.owner);const related=[t.owner,...(t.collab||[])];if(type==='company')return true;if(type==='project')return t.project===id;if(type==='department')return related.some(e=>staff(e)?.dept===id);if(type==='team')return related.some(e=>staff(e)?.teams.includes(id));if(type==='employee')return related.includes(id);if(type==='manager')return related.some(e=>reportingSubtree(id).has(e));if(type==='role')return related.some(e=>staff(e)?.role===id);return false}
function visibleTasks(){return tasks.filter(t=>inScope(t)&&(!filterProject||t.project===filterProject)&&(!filterOwner||[t.owner,...(t.collab||[])].includes(filterOwner))&&(!filterStatus||t.status===filterStatus)&&(!filterText||[t.id,t.title,project(t.project)?.name||'',staff(t.owner)?.name||''].join(' ').toLowerCase().includes(filterText.toLowerCase())))}
function metrics(data){const accepted=data.filter(t=>t.status==='accepted').length,blocked=data.filter(t=>t.status==='blocked').length,active=data.filter(t=>['in_progress','in_review'].includes(t.status)).length;return{tasks:data.length,accepted,blocked,active,spent:data.reduce((s,t)=>s+Number(t.cost||0),0),projects:new Set(data.map(t=>t.project).filter(Boolean)).size}}
function status(s){const found=STATES.find(x=>x[0]===s);return `<span class="status ${escapeH(s)}">${found?found[1]:escapeH(s)}</span>`}
function kpi(label,val,foot,action=''){return `<div class="card ${action?'interactive':''}" ${action?`data-action="${action}"`:''}><div class="kpi-label">${label}</div><div class="kpi-num">${val}</div><div class="kpi-foot">${foot}</div></div>`}
function heading(title,desc,buttons=''){return `<div class="heading"><div><div class="eyebrow">AI BUSINESS OPERATING SYSTEM</div><h1>${title}</h1><div class="section-sub">${desc}</div></div><div class="actions">${buttons}</div></div>`}
function taskButton(label='＋ Giao việc'){return `<button class="btn primary" data-action="assign">${label}</button>`}
function overview(){const m=metrics(tasks);const pending=approvals.filter(a=>a.status==='PENDING').length;const budget=280;return heading('Điều hành toàn công ty','Toàn cảnh lực lượng AI, dự án, công việc và chi phí. Dữ liệu mô phỏng.',taskButton())+`<div class="grid kpis">${kpi('Nhân viên AI đang hoạt động',STAFF.filter(e=>e.kind==='AI').length,'3 phòng ban · 5 team')}${kpi('Dự án',PROJECTS.length,'2 đang thực hiện · 1 kế hoạch', 'go-projects')}${kpi('Tasks đang thực hiện',m.active,'Tất cả phòng ban', 'go-active')}${kpi('Chờ phê duyệt',pending,'Yêu cầu có rủi ro cao','go-approvals')}</div><div class="grid cols-2"><div class="card"><div class="row"><h2>Danh mục dự án</h2><button class="btn mini" data-nav="projects">Xem tất cả</button></div>${PROJECTS.map(p=>{const t=tasks.filter(x=>x.project===p.id);const done=t.filter(x=>x.status==='accepted').length;const pct=t.length?Math.round(done/t.length*100):0;return `<div class="listline interactive" data-project="${p.id}"><div class="row"><b>${escapeH(p.name)}</b><span class="chip">${p.code}</span></div><div class="muted small">${t.length} tasks · ${done} accepted · Chủ dự án: ${escapeH(staff(p.owner)?.name)}</div><div class="progress" style="margin-top:10px"><span style="width:${pct}%"></span></div><div class="row small muted" style="margin-top:5px"><span>Tiến độ nghiệm thu ${pct}%</span><span>${money(p.spent)} / ${money(p.budget)}</span></div></div>`}).join('')}</div><div class="card"><div class="row"><h2>Project & Task Health</h2><span class="chip">Demo snapshot</span></div>${[['Accepted',m.accepted,Math.max(1,m.tasks)],['In progress',m.active,Math.max(1,m.tasks)],['Blocked',m.blocked,Math.max(1,m.tasks)],['Backlog',tasks.filter(t=>t.status==='backlog').length,Math.max(1,m.tasks)]].map(([label,n,den])=>`<div class="barrow"><span>${label}</span><div class="progress"><span style="width:${n/den*100}%"></span></div><b>${n}</b></div>`).join('')}<div class="note" style="margin-top:25px">Company → Department / Team → Project / Employee → Task → Execution. Mỗi task gốc chỉ được đếm một lần ở phạm vi công ty.</div><div style="margin-top:18px" class="row"><span class="muted">Ước tính cost trên demo tasks</span><b>${money(m.spent)}</b></div><div class="row" style="margin-top:8px"><span class="muted">Chi tiêu provider/infra tổng hợp (mô phỏng)</span><b>${money(165.26)}</b></div></div></div><div class="grid cols-2" style="margin-top:18px"><div class="card"><div class="row"><h2>Việc cần chú ý</h2><button class="btn mini" data-nav="board">Mở board</button></div>${tasks.filter(t=>['blocked','in_review'].includes(t.status)).slice(0,5).map(t=>`<div class="listline interactive row" data-task="${t.id}"><div><b>${escapeH(t.title)}</b><div class="small muted">${t.id} · ${escapeH(staff(t.owner)?.name)}</div></div>${status(t.status)}</div>`).join('')}</div><div class="card"><div class="row"><h2>AI workforce</h2><button class="btn mini" data-nav="organization">Sơ đồ</button></div>${STAFF.filter(e=>e.kind==='AI').slice(0,5).map(e=>`<div class="listline interactive row" data-employee="${e.id}"><div><b>${e.name}</b><div class="small muted">${e.title} · ${e.provider}</div></div><span class="chip">${e.kpi}% KPI</span></div>`).join('')}</div></div>`}
function orgNode(id){const e=staff(id),children=STAFF.filter(x=>x.manager===id);return `<li><div class="org-node" data-employee="${e.id}"><div class="symbol">${e.kind==='AI'?'◈':'◉'}</div><div class="name">${escapeH(e.name)}</div><div class="role">${escapeH(e.title)}</div><div class="chip">${escapeH(e.role)}</div><div class="model">${escapeH(e.model)}</div></div>${children.length?`<ul>${children.map(c=>orgNode(c.id)).join('')}</ul>`:''}</li>`}
function organization(){return heading('Sơ đồ tổ chức','Click bất kỳ nhân viên nào để xem title, role, quản lý, MCP/skills, tasks, model và KPI.',taskButton())+`<div class="card"><div class="row"><h2>Organizational hierarchy</h2><span class="chip">1 direct manager / employee</span></div><div class="org-scroll"><div class="tree"><ul>${STAFF.filter(e=>!e.manager).map(e=>orgNode(e.id)).join('')}</ul></div></div><div class="note">Đường nối thể hiện quan hệ báo cáo trực tiếp. Thành viên dự án, team và cộng tác chéo không thay đổi quản lý trực tiếp.</div></div>`}
function board(){const data=visibleTasks(),m=metrics(data);const opts=scopeItems();return heading('Unified Work Board','Xem task theo toàn công ty, phòng ban, team, dự án, từng nhân viên, quản lý hoặc role.',taskButton())+`<div class="toolbar-filters"><select id="scopeSelect" class="select" aria-label="Scope">${opts.map(([v,l])=>`<option value="${escapeH(v)}" ${scope===v?'selected':''}>${escapeH(l)}</option>`).join('')}</select><select id="filterProject" class="select" aria-label="Project"><option value="">Tất cả dự án</option>${PROJECTS.map(p=>`<option value="${p.id}" ${filterProject===p.id?'selected':''}>${escapeH(p.code)}</option>`).join('')}</select><select id="filterOwner" class="select" aria-label="Employee"><option value="">Mọi nhân viên</option>${STAFF.map(e=>`<option value="${e.id}" ${filterOwner===e.id?'selected':''}>${escapeH(e.name)}</option>`).join('')}</select><select id="filterStatus" class="select" aria-label="Status"><option value="">Mọi trạng thái</option>${STATES.map(([v,l])=>`<option value="${v}" ${filterStatus===v?'selected':''}>${l}</option>`).join('')}</select><input id="filterText" class="input" style="width:180px" value="${escapeH(filterText)}" placeholder="Tìm task..."><button class="btn" data-action="reset-filter">Xóa lọc</button></div><div class="grid kpis">${kpi('Task đang hiển thị',m.tasks,'Distinct task IDs')}${kpi('Đang thực hiện / review',m.active,'Trong bộ lọc hiện tại')}${kpi('Bị chặn',m.blocked,'Click để lọc','filter-blocked')}${kpi('Chi phí task',money(m.spent),'Chi phí giả lập theo task')}</div><div class="row" style="margin-bottom:14px"><div class="flex"><span class="chip">Phạm vi: ${escapeH(opts.find(x=>x[0]===scope)?.[1]||'')}</span><span class="muted small">${m.projects} dự án có task</span></div><div class="flex"><button class="btn mini ${boardMode==='kanban'?'primary':''}" data-mode="kanban">Kanban</button><button class="btn mini ${boardMode==='table'?'primary':''}" data-mode="table">Table</button></div></div>${boardMode==='kanban'?`<div class="kanban">${STATES.map(([code,label])=>{const arr=data.filter(t=>t.status===code);return `<div class="kanban-col" data-drop="${code}"><div class="kanban-title">${label}<em>${arr.length}</em></div>${arr.map(t=>`<div class="taskcard" data-task="${t.id}" draggable="true" data-drag-task="${t.id}"><div class="row"><span class="taskid">${t.id}</span><span class="pillpriority">${t.priority}</span></div><div class="tasktitle">${escapeH(t.title)}</div><div class="taskmeta"><span>${escapeH(staff(t.owner)?.name)}</span><span>${escapeH(project(t.project)?.code||'Operations')}</span></div><div class="taskmeta" style="margin-top:8px"><span>${money(t.cost)}</span><span>${t.due}</span></div></div>`).join('')}</div>`}).join('')}</div>`:`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Task</th><th>Project</th><th>Owner</th><th>Trạng thái</th><th>Ưu tiên</th><th>Due</th><th>Chi phí</th></tr></thead><tbody>${data.map(t=>`<tr data-id="${t.id}" data-task="${t.id}"><td class="font-mono">${t.id}</td><td><b>${escapeH(t.title)}</b></td><td>${escapeH(project(t.project)?.code||'Operations')}</td><td>${escapeH(staff(t.owner)?.name)}</td><td>${status(t.status)}</td><td>${t.priority}</td><td>${t.due}</td><td>${money(t.cost)}</td></tr>`).join('')}</tbody></table>${!data.length?'<div class="empty">Không có task trong phạm vi này.</div>':''}</div>`}<div class="muted small" style="margin-top:14px">Demo hỗ trợ kéo thả Kanban và tạo task bằng trình duyệt. Production sẽ kiểm tra quyền, dependency, policy và workflow khi đổi trạng thái.</div>`}
function projects(){return heading('Project Portfolio','Dự án liên team / liên phòng ban, KPI, ngân sách, milestone và backlog.',taskButton('＋ Giao task'))+`<div class="grid cols-3">${PROJECTS.map(p=>{const t=tasks.filter(x=>x.project===p.id),acc=t.filter(x=>x.status==='accepted').length,pct=t.length?Math.round(acc/t.length*100):0;return `<div class="card project-card" data-project="${p.id}"><div class="row"><span class="chip">${p.code}</span><span class="chip">${p.status}</span></div><h2 style="margin:17px 0 8px">${escapeH(p.name)}</h2><p class="muted small">${escapeH(p.description)}</p><div class="kv"><span>Project Owner</span><b>${escapeH(staff(p.owner)?.name)}</b></div><div class="kv"><span>Tasks / Accepted</span><b>${t.length} / ${acc}</b></div><div class="kv"><span>Budget / Spent</span><b>${money(p.budget)} / ${money(p.spent)}</b></div><div class="progress" style="margin-top:18px"><span style="width:${pct}%"></span></div><div class="small muted" style="margin-top:7px">${pct}% accepted · Due ${p.due}</div><div class="flex" style="margin-top:13px">${p.teams.map(x=>`<span class="chip">${escapeH(TEAMS.find(z=>z.id===x)?.name||x)}</span>`).join('')}</div></div>`}).join('')}</div>`}
function employees(){return heading('AI Workforce','Nhân viên giữ vị trí/role riêng, có manager, model, quota, MCP và skills.',taskButton())+`<div class="tablewrap"><table><thead><tr><th>Nhân viên</th><th>Title / Role</th><th>Department</th><th>Manager</th><th>Model</th><th>KPI</th><th>Spend</th></tr></thead><tbody>${STAFF.map(e=>`<tr data-employee="${e.id}"><td><b>${e.name}</b><div class="muted tiny">${e.kind}</div></td><td>${e.title}<div class="muted tiny">${e.role}</div></td><td>${DEPTS.find(x=>x.id===e.dept)?.name||''}</td><td>${staff(e.manager)?.name||'—'}</td><td>${e.model}<div class="muted tiny">${e.provider}</div></td><td>${e.kpi}%</td><td>${money(e.spent)}</td></tr>`).join('')}</tbody></table></div>`}
function capabilities(){return heading('Models, MCP & Skills','Registry và governance theo vị trí, agent, task và model capability.')+`<div class="grid cols-2"><div class="card"><h2>Provider & Model Registry</h2>${[{name:'Provider A',items:'Model X, Model Y',support:'Tool Calling / JSON mode'},{name:'Provider B',items:'Model Z',support:'Tool Calling / Parallel Tools'},{name:'Ollama Local',items:'Local 9B',support:'Runtime-specific tool support'}].map(x=>`<div class="toolrow"><div class="row"><b>${x.name}</b><span class="status active">Connected (mock)</span></div><div class="small muted">${x.items}</div><div class="tiny muted">${x.support}</div></div>`).join('')}</div><div class="card"><h2>MCP Server Catalogue</h2>${[{n:'web-mcp',t:'search / retrieve',risk:'R1'},{n:'git-mcp',t:'read / commit / PR',risk:'R2'},{n:'shell-mcp',t:'sandbox shell commands',risk:'R3'},{n:'budget-mcp',t:'ledger query / reports',risk:'R1'},{n:'docs-mcp',t:'read / create document',risk:'R2'},{n:'task-mcp',t:'task query / delegation',risk:'R2'}].map(x=>`<div class="toolrow row"><div><b class="font-mono">${x.n}</b><div class="muted tiny">${x.t}</div></div><span class="chip">${x.risk}</span></div>`).join('')}</div></div><div class="card" style="margin-top:15px"><h2>Permission resolution</h2><div class="note"><b>Effective Tool Access</b> = Organization Allow ∩ Position Ceiling ∩ Agent Grant ∩ Task Scope ∩ Runtime/Model Capability ∩ Required Approvals. Skills are versioned procedures, not tool grants.</div><div class="muted small" style="margin-top:12px">Bấm vào nhân viên tại màn Workforce hoặc Org Chart để xem danh sách MCP và Skills cá nhân của agent.</div></div>`}
function approvalsView(){return heading('Approval Inbox','Mọi quyết định nhạy cảm cần người có thẩm quyền phê duyệt; UI này chỉ mô phỏng.')+`<div class="card"><div class="row"><h2>Pending requests</h2><span class="chip">${approvals.filter(a=>a.status==='PENDING').length} pending</span></div>${approvals.map(a=>`<div class="listline"><div class="row"><div><b>${escapeH(a.title)}</b><div class="small muted">${a.id} · ${escapeH(a.type)} · Requested by ${staff(a.requestedBy)?.name}</div></div><div class="flex"><span class="chip">Risk ${a.risk}</span>${a.status==='PENDING'?`<button class="btn mini" data-decision="${a.id}:REJECTED">Reject</button><button class="btn mini primary" data-decision="${a.id}:APPROVED">Approve</button>`:status(a.status.toLowerCase())}</div></div></div>`).join('')}</div><div class="note" style="margin-top:15px">Demo cho phép thay đổi trạng thái phê duyệt để minh họa. Bản production phải kiểm tra actor, no self-approval, policy và audit.</div>`}
function render(){renderNav();const renderPage={overview,organization,board,projects,employees,capabilities,approvals:approvalsView};$('#root').innerHTML=(renderPage[page]||overview)();$('#breadcrumb').textContent=NAV.find(x=>x[0]===page)?.[2]||'Overview'}
function layoutModal(title,body,footer=''){return `<div class="modal-layer modal-center" data-overlay="1"><div class="dialog" role="dialog" aria-modal="true" aria-label="${escapeH(title)}"><div class="row"><h2>${escapeH(title)}</h2><button class="close" data-close="1" aria-label="Close">×</button></div>${body}${footer}</div></div>`}
function employeeDetail(id,tab='overview'){const e=staff(id);if(!e)return;selectedId=id;employeeTab=tab;const owned=tasks.filter(t=>t.owner===id||t.collab?.includes(id));const running=owned.filter(t=>['in_progress','in_review','blocked'].includes(t.status));let content='';if(tab==='overview')content=`<div class="grid cols-2"><div class="card"><h3>Workload</h3><div class="kpi-num">${running.length}</div><div class="muted small">Tasks đang tiến hành / chờ review / blocked</div></div><div class="card"><h3>Performance score</h3><div class="kpi-num">${e.kpi}%</div><div class="muted small">Điểm KPI mock, chưa được benchmark</div></div></div><div class="kv"><span>Employee type</span><b>${e.kind}</b></div><div class="kv"><span>Job title</span><b>${e.title}</b></div><div class="kv"><span>Role</span><b>${e.role}</b></div><div class="kv"><span>Department</span><b>${DEPTS.find(x=>x.id===e.dept)?.name}</b></div><div class="kv"><span>Teams</span><b>${e.teams.map(t=>TEAMS.find(x=>x.id===t)?.name).join(', ')||'—'}</b></div><div class="kv"><span>Direct manager</span><b>${staff(e.manager)?.name||'None / Founder'}</b></div><div class="kv"><span>Direct reports</span><b>${STAFF.filter(x=>x.manager===id).length}</b></div><div class="kv"><span>Model / Provider</span><b>${e.model} · ${e.provider}</b></div><div class="kv"><span>Monthly cap</span><b>${money(e.budget)}</b></div><div class="kv"><span>Spend (mock)</span><b>${money(e.spent)}</b></div><div class="progress" style="margin-top:12px"><span style="width:${e.budget?Math.min(100,e.spent/e.budget*100):0}%"></span></div>`;
if(tab==='tasks')content=`<div class="row"><h3>Assigned / Related tasks (${owned.length})</h3><button class="btn mini primary" data-action="assign:${id}">＋ Giao việc</button></div>${owned.length?owned.map(t=>`<div class="listline interactive row" data-task="${t.id}"><div><div class="font-mono">${t.id} · ${escapeH(project(t.project)?.code||'Operations')}</div><b>${escapeH(t.title)}</b><div class="small muted">${money(t.cost)} · ${t.due}</div></div>${status(t.status)}</div>`).join(''):'<div class="empty">Chưa có task nào.</div>'}`;
if(tab==='tools')content=`<h3>Position MCP / Tool Ceiling · ${escapeH(e.role)}</h3><div class="flex">${(POSITION_CAPS[e.role]||[]).map(x=>`<span class="chip">${escapeH(x)}</span>`).join('')||'<span class="muted">No baseline</span>'}</div><h3 style="margin-top:22px">MCP Servers được grant riêng cho agent</h3><div class="flex">${e.mcp.map(x=>`<span class="chip">${escapeH(x)}</span>`).join('')||'<span class="muted">Human account</span>'}</div><h3 style="margin-top:22px">Agent Skills</h3><div class="flex">${e.skills.map(x=>`<span class="chip">${escapeH(x)}</span>`).join('')}</div><h3 style="margin-top:22px">Effective entitlements (ví dụ)</h3>${[...new Set([...(POSITION_CAPS[e.role]||[]),...e.mcp])].map(x=>`<div class="kv"><span class="font-mono">${escapeH(x)}</span><b>${(POSITION_CAPS[e.role]||[]).includes(x)&&e.mcp.includes(x)?'<span style="color:var(--green)">Eligible*</span>':'<span style="color:var(--red)">Not granted</span>'}</b></div>`).join('')}<div class="note" style="margin-top:16px">* Eligible ở cấp Position ∩ Agent; tool call thực tế còn bị giới hạn bởi company, task, model capability, target scope, budget và approval. Skills không tự cấp quyền.</div><div class="toolrow"><div class="font-mono">effective_access = org ∩ position ∩ employee ∩ task ∩ policy</div><div class="muted small">Tool Call Audit: policy decision / target scope / approval / input hash / cost</div></div>`;
if(tab==='kpis')content=`<div class="grid cols-2">${kpi('Quality / KPI',e.kpi+'%','Demo based on mock scores')}${kpi('Active / Review',running.length,'Current task load')}${kpi('Assigned work',owned.length,'All task states')}${kpi('Monthly spend',money(e.spent),'Cap '+money(e.budget))}</div><h3 style="margin-top:22px">Model / Provider performance</h3><div class="kv"><span>Primary model</span><b>${e.model}</b></div><div class="kv"><span>Provider</span><b>${e.provider}</b></div><div class="kv"><span>Benchmark quality confidence</span><b>Demo / N/A</b></div><div class="kv"><span>Decision policy</span><b>Approval required</b></div>`;
$('#overlay').innerHTML=`<div class="modal-layer" data-overlay="1"><aside class="drawer" role="dialog" aria-label="Employee detail" aria-modal="true"><div class="row"><span class="eyebrow">EMPLOYEE DETAIL · ${id.toUpperCase()}</span><button class="close" data-close="1">×</button></div><div class="profile-banner"><div class="profile-ico">${e.kind==='AI'?'◈':'◉'}</div><div><div class="profile-title">${escapeH(e.name)}</div><div class="muted small">${e.title} · ${e.role}</div><div class="flex" style="margin-top:6px"><span class="status active">Active</span><span class="chip">${e.kind}</span></div></div></div><div class="actions"><button class="btn primary" data-action="assign:${id}">＋ Giao việc</button>${e.manager?`<button class="btn" data-employee="${e.manager}">Xem quản lý</button>`:''}</div><div class="tabs">${[['overview','Tổng quan'],['tasks','Tasks'],['tools','MCP / Skills'],['kpis','Hiệu suất']].map(([v,l])=>`<button class="tab ${tab===v?'selected':''}" data-emp-tab="${id}:${v}">${l}</button>`).join('')}</div>${content}</aside></div>`}
function projectDetail(id){const p=project(id);if(!p)return;const pt=tasks.filter(t=>t.project===id),acc=pt.filter(t=>t.status==='accepted').length;const content=`<p class="muted">${escapeH(p.description)}</p><div class="grid cols-2">${kpi('Tasks',pt.length,'Total tasks')}${kpi('Accepted',acc,'Confirmed by reviewer')}${kpi('Budget',money(p.budget),'Project ceiling')}${kpi('Used',money(p.spent),'Mock tracked spend')}</div><div class="kv"><span>Owner</span><b>${staff(p.owner)?.name}</b></div><div class="kv"><span>Deadline</span><b>${p.due}</b></div><div class="kv"><span>Teams</span><b>${p.teams.map(t=>TEAMS.find(x=>x.id===t)?.name).join(', ')}</b></div><h3 style="margin-top:20px">Milestones</h3>${p.milestones.map(m=>`<div class="listline"><span style="color:${m.done?'var(--green)':'var(--orange)'}">${m.done?'✓':'◌'}</span> ${escapeH(m.name)}</div>`).join('')}<h3 style="margin-top:20px">Task backlog</h3>${pt.map(t=>`<div class="listline row interactive" data-task="${t.id}"><div><div class="font-mono">${t.id}</div><b>${escapeH(t.title)}</b></div>${status(t.status)}</div>`).join('')}<div class="actions" style="margin-top:20px"><button class="btn primary" data-action="assignproject:${id}">＋ Giao task trong dự án</button><button class="btn" data-action="viewproject:${id}">Xem board dự án</button></div>`;
$('#overlay').innerHTML=layoutModal(p.code+' · '+p.name,content)}
function taskDetail(id){const t=tasks.find(x=>x.id===id);if(!t)return;const e=staff(t.owner);let body=`<div class="font-mono">${t.id} · ${escapeH(project(t.project)?.code||'Independent operations')}</div><h2 style="font-size:22px;margin:8px 0">${escapeH(t.title)}</h2><div class="flex">${status(t.status)}<span class="chip">Priority ${t.priority}</span></div><div class="kv"><span>Accountable owner</span><b>${escapeH(e?.name||'')}</b></div><div class="kv"><span>Project</span><b>${escapeH(project(t.project)?.name||'No project')}</b></div><div class="kv"><span>Direct manager</span><b>${escapeH(staff(e?.manager)?.name||'Founder')}</b></div><div class="kv"><span>Deadline</span><b>${t.due}</b></div><div class="kv"><span>Model / Provider</span><b>${escapeH(e?.model||'-')} · ${escapeH(e?.provider||'-')}</b></div><div class="kv"><span>LLM/tool expense (demo)</span><b>${money(t.cost)}</b></div><div class="kv"><span>Execution attempts</span><b>${t.execs||0}</b></div><h3 style="margin-top:18px">Acceptance criteria</h3><p class="muted">${escapeH(t.criteria||'Not specified')}</p><h3 style="margin-top:18px">Execution trace sample</h3><div class="toolrow"><div class="font-mono">Execution #${t.execs||0} → ${escapeH(e?.model||'Model')} → policy check → MCP tool → usage ledger</div><div class="small muted">Dữ liệu minh họa, chưa có inference thật. Tool-call input/output, tokens và audit sẽ do API cung cấp.</div></div><div class="formgroup"><label for="taskNewStatus">Đổi trạng thái (demo)</label><select class="select" id="taskNewStatus" style="width:100%">${STATES.map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" data-change-task="${t.id}">Lưu trạng thái</button><button class="btn" data-employee="${t.owner}">Xem employee</button>${t.project?`<button class="btn" data-project="${t.project}">Xem project</button>`:''}</div>`;
$('#overlay').innerHTML=layoutModal('Task detail',body)}
function assignForm(owner='',pId=''){const options=STAFF.filter(e=>e.kind==='AI');const defaultOwner=owner||options[0].id;const content=`<div class="note" style="margin:6px 0 18px">Task được tạo trong bộ dữ liệu demo và lưu trong localStorage của trình duyệt. Không gọi AI hoặc API thật.</div><form id="taskForm"><div class="formgroup"><label>Tiêu đề task *</label><input class="input" name="title" required maxlength="150" placeholder="Ví dụ: Benchmark model cho Research Agent"></div><div class="formgroup"><label>Mô tả</label><textarea class="textarea" name="description" placeholder="Mục tiêu, phạm vi, dữ liệu đầu vào..."></textarea></div><div class="twofield"><div class="formgroup"><label>Người chịu trách nhiệm *</label><select name="owner" class="select" style="width:100%">${options.map(e=>`<option value="${e.id}" ${defaultOwner===e.id?'selected':''}>${e.name} · ${e.title}</option>`).join('')}</select></div><div class="formgroup"><label>Dự án</label><select name="project" class="select" style="width:100%"><option value="">Không thuộc dự án</option>${PROJECTS.map(p=>`<option value="${p.id}" ${pId===p.id?'selected':''}>${p.code}</option>`).join('')}</select></div></div><div class="twofield"><div class="formgroup"><label>Độ ưu tiên</label><select class="select" name="priority" style="width:100%"><option>MEDIUM</option><option>LOW</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="formgroup"><label>Deadline</label><input class="input" type="date" name="due" value="2026-11-15" required></div></div><div class="formgroup"><label>Điều kiện nghiệm thu *</label><textarea class="textarea" required name="criteria" placeholder="Bằng chứng rõ ràng để đánh giá Accepted"></textarea></div><div class="twofield"><div class="formgroup"><label>Task budget (USD)</label><input class="input" type="number" name="budget" min="0" step="0.01" value="1.00"></div><div class="formgroup"><label>Max steps</label><input class="input" type="number" name="maxsteps" min="1" max="500" value="25"></div></div><div class="actions" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">Hủy</button><button class="btn primary" type="submit">Tạo task</button></div></form>`;$('#overlay').innerHTML=layoutModal('Giao việc cho AI Employee',content)}
function setTaskStatus(id,to){const t=tasks.find(x=>x.id===id);if(!t)return;t.status=to;persist();render();notice(`${id}: chuyển sang ${STATES.find(s=>s[0]===to)?.[1]||to} (demo)`)}
function close(){ $('#overlay').innerHTML='' }
// Event delegation; dialog content is generated from escaped data.
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-nav],[data-action],[data-employee],[data-project],[data-task],[data-close],[data-overlay],[data-mode],[data-emp-tab],[data-change-task],[data-decision]');if(!el)return;
if(el.dataset.overlay&&ev.target===el){close();return}if(el.dataset.close){close();return}
if(el.dataset.nav){close();setPage(el.dataset.nav);return}
if(el.dataset.employee){employeeDetail(el.dataset.employee);return}
if(el.dataset.project){projectDetail(el.dataset.project);return}
if(el.dataset.task){taskDetail(el.dataset.task);return}
if(el.dataset.empTab){const [id,tab]=el.dataset.empTab.split(':');employeeDetail(id,tab);return}
if(el.dataset.mode){boardMode=el.dataset.mode;render();return}
if(el.dataset.changeTask){setTaskStatus(el.dataset.changeTask,$('#taskNewStatus').value);close();return}
if(el.dataset.decision){const [id,v]=el.dataset.decision.split(':');const a=approvals.find(x=>x.id===id);if(a){a.status=v;notice(`${id} ${v} (demo only)`);render()}return}
const a=el.dataset.action;if(!a)return;
if(a==='assign'){assignForm();return}if(a.startsWith('assign:')){assignForm(a.split(':')[1]);return}if(a.startsWith('assignproject:')){assignForm('',a.split(':')[1]);return}if(a.startsWith('viewproject:')){scope='project:'+a.split(':')[1];filterProject='';close();setPage('board');return}
if(a==='go-projects'){setPage('projects');return}if(a==='go-active'){filterStatus='in_progress';setPage('board');return}if(a==='go-approvals'){setPage('approvals');return}if(a==='filter-blocked'){filterStatus='blocked';render();return}if(a==='reset-filter'){scope='company:all';filterProject='';filterOwner='';filterStatus='';filterText='';render();return}
});
document.addEventListener('change',ev=>{if(ev.target.id==='scopeSelect'){scope=ev.target.value;render()}if(ev.target.id==='filterProject'){filterProject=ev.target.value;render()}if(ev.target.id==='filterOwner'){filterOwner=ev.target.value;render()}if(ev.target.id==='filterStatus'){filterStatus=ev.target.value;render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='filterText'){filterText=ev.target.value;const pos=ev.target.selectionStart;render();const x=$('#filterText');x.focus();x.setSelectionRange(pos,pos)}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='taskForm')return;ev.preventDefault();const f=new FormData(ev.target);const title=String(f.get('title')||'').trim(),criteria=String(f.get('criteria')||'').trim();if(!title||!criteria){notice('Cần có title và acceptance criteria');return}const next=Math.max(115,...tasks.map(t=>Number((t.id||'').replace(/\D/g,''))||0))+1;const task={id:'T-'+next,title,project:f.get('project')||null,owner:String(f.get('owner')),collab:[],status:'ready',priority:String(f.get('priority')),cost:0,due:String(f.get('due')),criteria,budget:Number(f.get('budget')||0),maxsteps:Number(f.get('maxsteps')||25),description:String(f.get('description')||''),execs:0};tasks.unshift(task);persist();close();scope='company:all';filterProject='';filterOwner='';filterStatus='';filterText='';setPage('board');notice(`Đã tạo ${task.id} cho ${staff(task.owner)?.name} (demo)`)});
let dragId='';document.addEventListener('dragstart',ev=>{const e=ev.target.closest('[data-drag-task]');if(!e)return;dragId=e.dataset.dragTask;ev.dataTransfer.setData('text/plain',dragId);ev.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',ev=>{const e=ev.target.closest('[data-drop]');if(!e)return;ev.preventDefault();e.classList.add('drop-active')});
document.addEventListener('dragleave',ev=>{const e=ev.target.closest('[data-drop]');if(e)e.classList.remove('drop-active')});
document.addEventListener('drop',ev=>{const e=ev.target.closest('[data-drop]');if(!e)return;ev.preventDefault();const id=ev.dataTransfer.getData('text/plain')||dragId;if(id){setTaskStatus(id,e.dataset.drop);notice('Đã chuyển trạng thái trong demo. Production cần policy + workflow validation.')}dragId=''});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
render();
</script>
</body></html>
